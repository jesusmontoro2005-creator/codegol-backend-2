spring.application.name=api

# Conexion a la base de datos MySQL
spring.datasource.url=${CODEGOL_DB_URL:jdbc:mysql://localhost:3306/codegol?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${CODEGOL_DB_USERNAME:root}
spring.datasource.password=${CODEGOL_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
codegol.security.token-secret=${CODEGOL_TOKEN_SECRET:codegol-local-dev-secret-change-this-before-deployment-2026}
codegol.biometria.clave=${CODEGOL_BIOMETRIA_KEY:}
